          root = pathlib.Path("routewise-project").resolve()
          root.mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as source:
              for member in source.infolist():
                  target = (root / member.filename).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError("Invalid source archive path")
              source.extractall(root)
          print("Prepared the Routewise Android project.")

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic
          cache-disabled: true

      - name: Check Android SDK on the GitHub runner
        shell: bash
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"

      - name: Compile Android APK
        run: gradle --no-daemon --console=plain -p routewise-project :app:assembleDebug

      - name: Verify and name APK
        shell: bash
        run: |
          mkdir -p output
          cp routewise-project/app/build/outputs/apk/debug/app-debug.apk output/Routewise.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify output/Routewise.apk

      - name: Save APK for phone download
        uses: actions/upload-artifact@v7
        with:
          path: output/Routewise.apk
          archive: false
          if-no-files-found: error
          retention-days: 7

# ROUTEWISE: one-file Android build for use from a phone.
# Upload this file to your own private GitHub repository, then rename it to:
# .github/workflows/routewise-build.yml
# A build starts when you commit that change to your main branch.
# Find Actions > Build Routewise APK > successful run > Artifacts > Routewise.apk.
# No source ZIP, Android Studio, access token or signing-key setup is required.
# The compressed app source is embedded below; it contains no saved financial records.
# This produces a personal debug APK. Back up records before replacing/uninstalling it.
name: Build Routewise APK

'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/routewise-build.yml'

permissions:
  contents: read

concurrency:
  group: routewise-apk-build
  cancel-in-progress: true

